<!doctype html>
<meta charset="utf-8">
<title>@libsql/client subpaths in a WebContainer</title>
<script type="module">
import { boot, run } from "./helpers.js"

window.repro = async () => {
  const container = await boot()
  try {
    await container.mount({
      "package.json": { file: { contents: JSON.stringify({ type: "module", dependencies: { "@libsql/client": "0.17.2" } }) } },
      "check.mjs": { file: { contents: `
        import { readFileSync } from "node:fs"
        const pkg = JSON.parse(readFileSync("node_modules/@libsql/client/package.json", "utf8"))
        console.log("installed:", pkg.name + "@" + pkg.version)
        console.log("exports:", Object.keys(pkg.exports).join(", "))
        for (const id of ["@libsql/client", "@libsql/client/http", "@libsql/client/web"]) {
          try { await import(id); console.log("import " + id + ": ok") }
          catch (error) { console.log("import " + id + ": " + error.code) }
        }
      ` } },
    })
    const install = await run(container, "npm", ["install", "--no-audit", "--no-fund"])
    const check = await run(container, "node", ["check.mjs"])
    return {
      lines: [`npm install exit ${install.exit}`, `$ node check.mjs\n${check.output}`, "expected: @libsql/client/http and @libsql/client/web import, as they do in Node"],
      bug: check.output.includes("ERR_PACKAGE_PATH_NOT_EXPORTED"),
      summary: check.output.includes("ERR_PACKAGE_PATH_NOT_EXPORTED") ? "the installed package has no ./http or ./web export" : "all subpaths import",
    }
  } finally {
    container.teardown()
  }
}
</script>
